name: Build Linux binaries

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Install cross
        run: cargo install cross --locked

      - name: Build x86_64 Linux (release)
       run: cross build --release --target x86_64-unknown-linux-gnu

      - name: Build aarch64 Linux (release)
        run: cross build --release --target aarch64-unknown-linux-gnu

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/intentcheck dist/intentcheck-linux-x86_64
          cp target/aarch64-unknown-linux-gnu/release/intentcheck dist/intentcheck-linux-aarch64
          chmod +x dist/intentcheck-linux-x86_64 dist/intentcheck-linux-aarch64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intentcheck-linux-binaries
          path: dist/*
